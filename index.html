<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Dashboard Financeiro</title>
  </head>
  <body>
    <header>
      <h1>Dashboard Financeiro</h1>
      <div>
        <img
          src="./assets/images/user.png"
          alt="logotipo do usuário"
          width="50"
          height="50"
        />
        <p>nome do usuario</p>
      </div>
    </header>
    <main>
      <aside>
        <nav>
          <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Entradas</a></li>
            <li><a href="#">Saídas</a></li>
            <li><a href="#">Relatórios</a></li>
            <li><a href="#">Configurações</a></li>
          </ul>
        </nav>
      </aside>
      <section>
        <h2>Saldo disponivel</h2>
        <p>R$ 1.000,00</p>

        <div>
          <div>
            <h3>Entradas</h3>
            <p>R$ 2.000,00</p>
          </div>
          <div>
            <h3>Saídas</h3>
            <p>R$ 1.000,00</p>
          </div>
        </div>

        <figure>
          <img
            src="https://adrianopataro.com.br/wp-content/uploads/2021/10/elementos-do-grafico-do-excel.png"
            alt="Gráfico de desempenho financeiro"
            height="300"
          />
        </figure>
        <h2>Ultimas transações</h2>
      </section>
    </main>
  </body>
</html>

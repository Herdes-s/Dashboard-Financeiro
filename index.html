<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Dashboard Financeiro</title>
  </head>
  <body>
    <header class="header">
      <div class="menu-container" id="menu-container">
        <img src="/assets/icons/menu.svg" alt="Menu" class="menu" />
      </div>
      <h1 class="header-title">Dashboard Financeiro</h1>
      <div class="user-info">
        <img
          class="user-logo"
          src="./assets/images/user.png"
          alt="logotipo do usuário"
          width="50"
          height="50"
        />
        <p class="user-name">nome do usuario</p>
      </div>
    </header>
    <main class="main">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Entradas</a></li>
            <li><a href="#">Saídas</a></li>
            <li><a href="#">Relatórios</a></li>
            <li><a href="#">Configurações</a></li>
          </ul>
        </nav>
      </aside>
      <section class="content">
        <h2 class="content-title">Saldo disponivel</h2>
        <p class="content-value">R$ 1.000,00</p>

        <div class="content-summary">
          <div class="summary-item">
            <h3 class="content-title">Entradas</h3>
            <p class="content-value">R$ 2.000,00</p>
          </div>
          <div class="summary-item">
            <h3 class="content-title">Saídas</h3>
            <p class="content-value">R$ 1.000,00</p>
          </div>
        </div>

        <figure class="content-figure">
          <img
            class="content-image"
            src="https://adrianopataro.com.br/wp-content/uploads/2021/10/elementos-do-grafico-do-excel.png"
            alt="Gráfico de desempenho financeiro"
            height="300"
          />
        </figure>
        <h2 class="content-title">Ultimas transações</h2>
      </section>
    </main>
    <script type="module" src="js/index.js"></script>
  </body>
</html>

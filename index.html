<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Dashboard Financeiro</title>
  </head>
  <body>
    <header class="header">
      <div class="menu-container" id="menu-container">
        <img src="/assets/icons/menu.svg" alt="Menu" class="menu" />
      </div>
      <h1 class="header-title">Dashboard Financeiro</h1>
      <div class="user-info">
        <img
          class="user-logo"
          src="./assets/images/user.png"
          alt="logotipo do usuário"
          width="50"
          height="50"
        />
        <p class="user-name">nome do usuario</p>
      </div>
    </header>
    <main class="main">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <ul>
            <li><a href="#" class="active">Dashboard</a></li>
            <li><a href="#">Entradas</a></li>
            <li><a href="#">Saídas</a></li>
            <li><a href="#">Relatórios</a></li>
            <li><a href="#">Configurações</a></li>
          </ul>
        </nav>
      </aside>
      <section class="content">
        <h2 class="content-title">Saldo disponivel</h2>
        <p class="content-value" id="total-balance">0</p>

        <div class="content-summary">
          <div class="summary-item">
            <h3 class="content-title">Entradas</h3>
            <p class="content-value" id="total-entries">1000</p>
          </div>
          <div class="summary-item">
            <h3 class="content-title">Saídas</h3>
            <p class="content-value" id="total-exits">100</p>
          </div>
        </div>

        <div class="chart-container">
          <div class="chart" id="my-chart"></div>
        </div>

        <h2 class="content-title">Ultimas transações</h2>
        <div class="recent-transactions">
          <div class="transaction">
            <span class="date">10/10/2026</span>
            <p class="transaction-title">Aluguel</p>
            <span class="price">200R$</span>
            <div class="transaction-btns">
              <button class="btn delete">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
              <button class="btn edit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="recent-transactions">
          <div class="transaction">
            <span class="date">10/10/2026</span>
            <p class="transaction-title">Aluguel</p>
            <span class="price">200R$</span>
            <div class="transaction-btns">
              <button class="btn delete">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
              <button class="btn edit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="recent-transactions">
          <div class="transaction">
            <span class="date">10/10/2026</span>
            <p class="transaction-title">Aluguel</p>
            <span class="price">200R$</span>
            <div class="transaction-btns">
              <button class="btn delete">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
              <button class="btn edit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="js/index.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="extrato-row">
      <!-- 1. Esquerda: Data -->
      <div class="extrato-date">
        <span class="day">10</span>
        <span class="month">OUT</span>
      </div>

      <!-- 2. Centro-Esquerda: Descrição e Categoria juntos -->
      <div class="extrato-info">
        <span class="extrato-title">Assinatura de Software</span>
        <span class="extrato-badge bg-tech">Tecnologia</span>
      </div>

      <!-- 3. Centro-Direita: Valor -->
      <div class="extrato-value">R$ 89,90</div>

      <!-- 4. Direita: Ações sutilmente visíveis -->
      <div class="extrato-actions">
        <button class="btn-action btn-edit" title="Editar">
          <!-- Ícone de Lápis Simplificado -->
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h9"></path>
            <path
              d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"
            ></path>
          </svg>
        </button>
        <button class="btn-action btn-delete" title="Excluir">
          <!-- Ícone de Lixeira Simplificado -->
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="3 6 5 6 21 6"></polyline>
            <path
              d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
            ></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
      </div>
    </div>

    <style>
      /* Container da Linha */
      .extrato-row {
        display: flex;
        align-items: center;
        background: #ffffff;
        border-bottom: 1px solid #f1f5f9;
        padding: 0.75rem 1.25rem;
        gap: 1.5rem;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        transition: background 0.2s ease;
      }

      /* Efeito sutil ao passar o mouse na linha */
      .extrato-row:hover {
        background-color: #f8fafc;
      }

      /* 1. Bloco de Data empilhado (Estilo Calendário) */
      .extrato-date {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 45px;
        line-height: 1.1;
      }

      .extrato-date .day {
        font-size: 1.1rem;
        font-weight: 700;
        color: #1e293b;
      }

      .extrato-date .month {
        font-size: 0.65rem;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* 2. Bloco de Informações (Cresce para ocupar o espaço disponível) */
      .extrato-info {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-grow: 1; /* Ocupa o centro da linha */
      }

      .extrato-title {
        font-size: 0.95rem;
        font-weight: 500;
        color: #334155;
      }

      .extrato-badge {
        font-size: 0.75rem;
        font-weight: 500;
        padding: 0.15rem 0.5rem;
        border-radius: 6px;
        white-space: nowrap;
      }

      .bg-tech {
        background-color: #e0e7ff;
        color: #4338ca;
      }

      /* 3. Bloco do Valor (Alinhado à direita e com destaque) */
      .extrato-value {
        font-size: 1rem;
        font-weight: 600;
        color: #0f172a;
        font-family: monospace;
        white-space: nowrap;
        text-align: right;
        min-width: 100px;
      }

      /* 4. Botões de Ação (Compactos com ícones) */
      .extrato-actions {
        display: flex;
        gap: 0.35rem;
        opacity: 0.4; /* Fica discreto por padrão */
        transition: opacity 0.2s ease;
      }

      /* Mostra as ações com mais nitidez quando o usuário passa o mouse na linha */
      .extrato-row:hover .extrato-actions {
        opacity: 1;
      }

      .btn-action {
        background: none;
        border: none;
        padding: 0.4rem;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #64748b;
        transition: all 0.2s;
      }

      .btn-edit:hover {
        background-color: #e0f2fe;
        color: #0369a1;
      }

      .btn-delete:hover {
        background-color: #fee2e2;
        color: #b91c1c;
      }
    </style>
  </body>
</html>
